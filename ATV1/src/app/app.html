  <div class="w-full h-[120px] bg-emerald-600 text-white text-[45px] font-bold"> <!--wfull ocupa a largura toda, h20 altura 80px-->
    <h1 class="p-4 font-[Open_Sans]">Plantas Raras & Kras</h1>
        <div class="flex gap-2 p-2">
            <p-button label="Criar" (click)="criarPlantas()"/> <!--Eventos de click com os métodos do crud-->
            <p-button label="Listar" (click)="listarPlantas()"/>
            <p-button label="Alterar" (click)="alterarPlantas()"/>
            <p-button label="Deletar" (click)="deletarPlantas()"/>
        </div>
    </div>

      <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6 p-8 bg-olive-200"> <!--Cards do OPTIMUS UI-->
        @for (planta of plantas; track planta.id) { <!--Repetir card para cada planta no array plantas, interpolação, data binding-->
            <p-card [style]="{ width: '25rem', overflow: 'hidden' }"> <!--Card 1-->
                <ng-template #header> 
                  <img alt="Planta" class="w-full h-[500px] object-cover" src="imagens/monstera1.webp" /> <!--property binding, vai pegar a imagem do array, nao vai usar imagem fixa-->
                </ng-template>
                <ng-template #title> {{ planta.nome }} </ng-template> <!--pega o nome que ta no array-->
                <ng-template #subtitle> Planta rara </ng-template>
                <p>
                    {{ planta.preco }}
                </p>
                <ng-template #footer>
                    <div class="flex gap-4 mt-1">
                        <p-button label="Cancel" severity="secondary" class="w-full" [outlined]="true" styleClass="w-full" />
                        <p-button label="Save" class="w-full" styleClass="w-full" />
                    </div>
                </ng-template>
            </p-card>
            }
        </div>
